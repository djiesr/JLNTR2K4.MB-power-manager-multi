    name: $hostname $total_power
    unit_of_measurement: 'kW'
    device_class: power
    state_class: measurement
    update_interval: 15s
    accuracy_decimals: 3
    lambda: |-
      float total = 0;
      for (auto *s : {id(power_c01), id(power_c02), id(power_c03), id(power_c04), id(power_c05), id(power_c06), id(power_c07), id(power_c08), id(power_c09), id(power_c10)}) {
        if (!std::isnan(s->state)) total += s->state;
      }
      return total;

  - platform: total_daily_energy
    id: tde_total
    name: $hostname $total_daily_energy
    power_id: power_total
    device_class: energy
    restore: true

########################################################## CT Clamp configuration (editable in HA) ##########################################

select:
  - platform: template
    id: ct_model_c01
    name: $ct_model
    device_id: dev_c01
    entity_category: config
    optimistic: true
    restore_value: true
    options: ["$ct_none", "5 A", "10 A", "15 A", "20 A", "30 A", "50 A", "100 A"]
    initial_option: "$ct_none"

  - platform: template
    id: ct_output_c01
    name: $ct_output
    device_id: dev_c01
    entity_category: config
    optimistic: true
    restore_value: true
    options: ["1 V", "0.5 V", "0.333 V"]
    initial_option: "1 V"

  # 230 V is last: the select saves its index, keep existing choices valid
  - platform: template
    id: circuit_voltage_c01
    name: $circuit_voltage
    device_id: dev_c01
    entity_category: config
    optimistic: true
    restore_value: true
    options: ["120 V", "240 V", "230 V"]
    initial_option: "120 V"

  - platform: template
    id: ct_model_c02
    name: $ct_model
    device_id: dev_c02
    entity_category: config
    optimistic: true
    restore_value: true
    options: ["$ct_none", "5 A", "10 A", "15 A", "20 A", "30 A", "50 A", "100 A"]
    initial_option: "$ct_none"

  - platform: template
    id: ct_output_c02
    name: $ct_output
    device_id: dev_c02
    entity_category: config
