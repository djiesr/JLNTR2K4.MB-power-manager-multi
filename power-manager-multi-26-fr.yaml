  - platform: http_request

http_request:
  verify_ssl: true

# Home Assistant shows "Update available" when a new version is published
update:
  - platform: http_request
    name: Firmware
    source: https://djiesr.github.io/JLNTR2K4.MB-power-manager-multi/power-manager-multi-26-fr/manifest.json
