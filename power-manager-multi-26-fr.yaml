# Screen
i2c:
  scl: D1
  sda: D2
  scan: false

font:
  - file: "gfonts://Roboto"
    id: font_title
    size: 14
  - file: "gfonts://Roboto Mono"
    id: font_small
    size: 12

interval:
  - interval: 5s
    then:
      - display.page.show_next: oled

display:
  - platform: ssd1306_i2c
    id: oled
    model: "SSD1306 128x64"
    reset_pin: D0
    address: 0x3C
    update_interval: 1s
    pages:
      - id: page_info
        lambda: |-
          it.print(0, 0, id(font_title), "Power Manager");
          it.print(0, 16, id(font_small), "${board_label} - 26 c.");
          it.printf(0, 32, id(font_small), "IP %s", id(ip_now).state.c_str());
          it.printf(0, 48, id(font_small), "Tot %6.0f W", id(power_total).state * 1000);
      - id: page_c01
        lambda: |-
          const char *lbl[] = {"A1", "A2", "B0", "B1"};
          sensor::Sensor *cur[] = {id(measured_current_c01), id(measured_current_c02), id(measured_current_c03), id(measured_current_c04)};
          sensor::Sensor *pwr[] = {id(power_c01), id(power_c02), id(power_c03), id(power_c04)};
          for (int i = 0; i < 4; i++)
            it.printf(0, i * 16, id(font_small), "%s %5.1fA %5.0fW", lbl[i], cur[i]->state, pwr[i]->state * 1000);
      - id: page_c05
        lambda: |-
          const char *lbl[] = {"B2", "B3", "B4", "B5"};
          sensor::Sensor *cur[] = {id(measured_current_c05), id(measured_current_c06), id(measured_current_c07), id(measured_current_c08)};
          sensor::Sensor *pwr[] = {id(power_c05), id(power_c06), id(power_c07), id(power_c08)};
          for (int i = 0; i < 4; i++)
            it.printf(0, i * 16, id(font_small), "%s %5.1fA %5.0fW", lbl[i], cur[i]->state, pwr[i]->state * 1000);
      - id: page_c09
        lambda: |-
          const char *lbl[] = {"B6", "B7", "C0", "C1"};
          sensor::Sensor *cur[] = {id(measured_current_c09), id(measured_current_c10), id(measured_current_c11), id(measured_current_c12)};
          sensor::Sensor *pwr[] = {id(power_c09), id(power_c10), id(power_c11), id(power_c12)};
          for (int i = 0; i < 4; i++)
            it.printf(0, i * 16, id(font_small), "%s %5.1fA %5.0fW", lbl[i], cur[i]->state, pwr[i]->state * 1000);
      - id: page_c13
        lambda: |-
          const char *lbl[] = {"C2", "C3", "C4", "C5"};
          sensor::Sensor *cur[] = {id(measured_current_c13), id(measured_current_c14), id(measured_current_c15), id(measured_current_c16)};
          sensor::Sensor *pwr[] = {id(power_c13), id(power_c14), id(power_c15), id(power_c16)};
          for (int i = 0; i < 4; i++)
            it.printf(0, i * 16, id(font_small), "%s %5.1fA %5.0fW", lbl[i], cur[i]->state, pwr[i]->state * 1000);
      - id: page_c17
        lambda: |-
          const char *lbl[] = {"C6", "C7", "D0", "D1"};
          sensor::Sensor *cur[] = {id(measured_current_c17), id(measured_current_c18), id(measured_current_c19), id(measured_current_c20)};
          sensor::Sensor *pwr[] = {id(power_c17), id(power_c18), id(power_c19), id(power_c20)};
          for (int i = 0; i < 4; i++)
            it.printf(0, i * 16, id(font_small), "%s %5.1fA %5.0fW", lbl[i], cur[i]->state, pwr[i]->state * 1000);
      - id: page_c21
        lambda: |-
          const char *lbl[] = {"D2", "D3", "D4", "D5"};
          sensor::Sensor *cur[] = {id(measured_current_c21), id(measured_current_c22), id(measured_current_c23), id(measured_current_c24)};
          sensor::Sensor *pwr[] = {id(power_c21), id(power_c22), id(power_c23), id(power_c24)};
          for (int i = 0; i < 4; i++)
            it.printf(0, i * 16, id(font_small), "%s %5.1fA %5.0fW", lbl[i], cur[i]->state, pwr[i]->state * 1000);
      - id: page_c25
        lambda: |-
          const char *lbl[] = {"D6", "D7"};
          sensor::Sensor *cur[] = {id(measured_current_c25), id(measured_current_c26)};
          sensor::Sensor *pwr[] = {id(power_c25), id(power_c26)};
          for (int i = 0; i < 2; i++)
            it.printf(0, i * 16, id(font_small), "%s %5.1fA %5.0fW", lbl[i], cur[i]->state, pwr[i]->state * 1000);
