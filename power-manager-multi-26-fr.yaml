    name: $hostname $total_power
    unit_of_measurement: 'kW'
    device_class: power
    state_class: measurement
    update_interval: 15s
    accuracy_decimals: 3
    lambda: |-
      float total = 0;
      for (auto *s : {id(power_c01), id(power_c02), id(power_c03), id(power_c04), id(power_c05), id(power_c06), id(power_c07), id(power_c08), id(power_c09), id(power_c10), id(power_c11), id(power_c12), id(power_c13), id(power_c14), id(power_c15), id(power_c16), id(power_c17), id(power_c18), id(power_c19), id(power_c20), id(power_c21), id(power_c22), id(power_c23), id(power_c24), id(power_c25), id(power_c26)}) {
        if (!std::isnan(s->state)) total += s->state;
      }
      return total;

  - platform: total_daily_energy
    id: tde_total
    name: $hostname $total_daily_energy
    power_id: power_total
    device_class: energy
    restore: true

########################################################## CT Clamp configuration (editable in HA) ##########################################

select:
  - platform: template
    id: ct_model_c01
    name: $ct_model
    device_id: dev_c01
    entity_category: config
    optimistic: true
    restore_value: true
    options: ["$ct_none", "5 A", "10 A", "15 A", "20 A", "25 A", "30 A", "50 A", "60 A", "100 A"]
    initial_option: "$ct_none"

  - platform: template
    id: ct_output_c01
