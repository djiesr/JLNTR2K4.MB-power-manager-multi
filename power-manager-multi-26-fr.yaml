spi:
  clk_pin: D5
  mosi_pin: D7
  miso_pin: D6

# One MCP3008 per extension board
mcp3008:
  - cs_pin: GPIO13
    id: main_board_1
  - cs_pin: GPIO15
    id: main_board_2
  - cs_pin: D8
    id: main_board_3

sensor:
  - platform: debug
    free:
      name: $hostname Free Memory
      entity_category: diagnostic
      disabled_by_default: true
    block:
      name: $hostname Largest Free Block
      entity_category: diagnostic
      disabled_by_default: true

  ###### Circuit A1 ######
  - platform: adc
    pin: GPIO34
    id: adc_c01
    attenuation: 12db
    update_interval: 60s
    internal: true

  - platform: ct_clamp
    sensor: adc_c01
    id: measured_current_c01
    name: $measured_current
    device_id: dev_c01
    update_interval: 15s
    accuracy_decimals: 3
    filters:
      - lambda: |-
          static const float RATING[] = {0, 5, 10, 15, 20, 25, 30, 50, 60, 100};
          static const float OUT_V[] = {1.0, 0.5, 0.333};
          float rating = RATING[id(ct_model_c01).active_index().value_or(0)];
          float out_v = OUT_V[id(ct_output_c01).active_index().value_or(0)];
          if (rating == 0 || x <= 0.003f) return 0.0f;
          return (x - 0.003f) * rating / (out_v - 0.003f) * id(ct_correction_c01).state / 100.0f;

  - platform: template
    id: power_c01
    name: $measured_power
    device_id: dev_c01
    unit_of_measurement: 'kW'
    device_class: power
    state_class: measurement
    update_interval: 15s
    accuracy_decimals: 3
    lambda: |-
      if (id(measured_current_c01).state > 0.03) {
        static const float VOLTS[] = {120.0f, 240.0f, 230.0f};
        float volts = VOLTS[id(breaker_type_c01).active_index().value_or(0)];
        return id(measured_current_c01).state * volts / 1000;
      }
      return 0.0;

  - platform: total_daily_energy
    id: tde_c01
    name: $measured_total_power_daily
    device_id: dev_c01
    power_id: power_c01
    device_class: energy
    restore: true

