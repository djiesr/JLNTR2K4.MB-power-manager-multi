    restore_value: true
    initial_value: 100
    min_value: 50
    max_value: 150
    step: 0.1
    unit_of_measurement: "%"
    mode: box

  - platform: template
    id: breaker_c22
    name: $breaker_number
    device_id: dev_c22
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 80
    step: 1
    mode: box
    on_value:
      - lambda: |-
          // A double breaker also takes the position 2 below (29 -> 29-31)
          static const int PANEL[] = {1, 2, 4, 6, 8, 12, 16, 24, 30, 32, 40, 60, 80};
          int panel = PANEL[id(panel_size).active_index().value_or(12)];
          int last = (int) x + (id(breaker_type_c22).active_index().value_or(0) == 1 ? 2 : 0);
          if (x > 0 && last > panel) {
            ESP_LOGW("breaker", "Breaker %d does not fit in a %d-position panel", (int) x, panel);
            id(breaker_c22).make_call().set_value(0).perform();
          }
