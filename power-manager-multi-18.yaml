# GENERATED FILE - edit tools/generate.py and run it again.
# Catroniq - Power Manager multiboard, 18 circuits

# These substitutions allow the end user to override certain values
substitutions:
  name: "power-manager-multi"
  # Modify variables if you use multiple boards
  hostname: 'PM'
  board_label: 'JLNTR2K4.MB'
  # Modify variables based on your circuit, like "breaker 01" or "dryer"
  ct_clamp_01: 'C01'
  ct_clamp_02: 'C02'
  ct_clamp_03: 'C03'
  ct_clamp_04: 'C04'
  ct_clamp_05: 'C05'
  ct_clamp_06: 'C06'
  ct_clamp_07: 'C07'
  ct_clamp_08: 'C08'
  ct_clamp_09: 'C09'
  ct_clamp_10: 'C10'
  ct_clamp_11: 'C11'
  ct_clamp_12: 'C12'
  ct_clamp_13: 'C13'
  ct_clamp_14: 'C14'
  ct_clamp_15: 'C15'
  ct_clamp_16: 'C16'
  ct_clamp_17: 'C17'
  ct_clamp_18: 'C18'
  # Modify variable based on your language
  measured_current: 'Measured Current'
  measured_power: 'Measured Power'
  measured_total_power_daily: 'Measured Daily Total'
  total_power: 'Total Power'
  total_daily_energy: 'Total Daily Energy'
  ct_model: 'CT Model'
  ct_output: 'CT Output'
  ct_none: 'None'
  circuit_voltage: 'Circuit Voltage'
  ct_correction: 'CT Correction'

esphome:
  name: "${name}"
  # One Home Assistant device per circuit (sensors + CT settings)
  devices:
    - id: dev_c01
      name: "$hostname $ct_clamp_01"
    - id: dev_c02
      name: "$hostname $ct_clamp_02"
    - id: dev_c03
      name: "$hostname $ct_clamp_03"
    - id: dev_c04
      name: "$hostname $ct_clamp_04"
    - id: dev_c05
      name: "$hostname $ct_clamp_05"
    - id: dev_c06
      name: "$hostname $ct_clamp_06"
    - id: dev_c07
      name: "$hostname $ct_clamp_07"
    - id: dev_c08
      name: "$hostname $ct_clamp_08"
    - id: dev_c09
      name: "$hostname $ct_clamp_09"
    - id: dev_c10
      name: "$hostname $ct_clamp_10"
    - id: dev_c11
      name: "$hostname $ct_clamp_11"
    - id: dev_c12
      name: "$hostname $ct_clamp_12"
    - id: dev_c13
      name: "$hostname $ct_clamp_13"
    - id: dev_c14
      name: "$hostname $ct_clamp_14"
    - id: dev_c15
      name: "$hostname $ct_clamp_15"
    - id: dev_c16
      name: "$hostname $ct_clamp_16"
    - id: dev_c17
      name: "$hostname $ct_clamp_17"
    - id: dev_c18
      name: "$hostname $ct_clamp_18"
  # Automatically add the mac address to the name
  # so you can use a single firmware for all devices
  name_add_mac_suffix: true
  project:
    name: esphome.power-manager-multi
    version: "8.0.0"

esp32:
  board: wemos_d1_mini32
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome
  # Lets the device install the firmware published on GitHub Pages
  - platform: http_request

http_request:
  verify_ssl: true

# Home Assistant shows "Update available" when a new version is published
update:
  - platform: http_request
    name: Firmware
    source: https://djiesr.github.io/JLNTR2K4.MB-power-manager-multi/power-manager-multi-18/manifest.json
    update_interval: 6h

dashboard_import:
  package_import_url: github://djiesr/JLNTR2K4.MB-power-manager-multi/power-manager-multi-18.yaml@main

wifi:
  ap:
    password: "12345678"

captive_portal:

# Wi-Fi setup over USB from the install page. Bluetooth improv (esp32_improv)
# is left out: it keeps ~50 KB of RAM busy, needed for HTTPS updates on big boards.
improv_serial:

# Free memory, to check there is room for HTTPS updates
debug:
  update_interval: 60s

web_server:
  port: 80
  version: 2

time:
  - platform: sntp
    id: my_time

text_sensor:
  - platform: wifi_info
    ip_address:
      name: $hostname ESP IP Address
      id: ip_now
      entity_category: diagnostic
      disabled_by_default: true
    ssid:
      name: $hostname ESP Connected SSID
      entity_category: diagnostic
      disabled_by_default: true
    mac_address:
      name: $hostname ESP Mac Wifi Address
      entity_category: diagnostic
      disabled_by_default: true

spi:
  clk_pin: D5
  mosi_pin: D7
  miso_pin: D6

# One MCP3008 per extension board
mcp3008:
  - cs_pin: GPIO13
    id: main_board_1
  - cs_pin: GPIO15
    id: main_board_2

sensor:
  - platform: debug
    free:
      name: $hostname Free Memory
      entity_category: diagnostic
      disabled_by_default: true
    block:
      name: $hostname Largest Free Block
      entity_category: diagnostic
      disabled_by_default: true

  ###### Circuit C01 ######
  - platform: adc
    pin: GPIO34
    id: adc_c01
    attenuation: 12db
    update_interval: 60s
    internal: true

  - platform: ct_clamp
    sensor: adc_c01
    id: measured_current_c01
    name: $measured_current
    device_id: dev_c01
    update_interval: 15s
    accuracy_decimals: 3
    filters:
      - lambda: |-
          static const float RATING[] = {0, 5, 10, 15, 20, 30, 50, 100};
          static const float OUT_V[] = {1.0, 0.5, 0.333};
          float rating = RATING[id(ct_model_c01).active_index().value_or(0)];
          float out_v = OUT_V[id(ct_output_c01).active_index().value_or(0)];
          if (rating == 0 || x <= 0.003f) return 0.0f;
          return (x - 0.003f) * rating / (out_v - 0.003f) * id(ct_correction_c01).state / 100.0f;

  - platform: template
    id: power_c01
    name: $measured_power
    device_id: dev_c01
    unit_of_measurement: 'kW'
    device_class: power
    state_class: measurement
    update_interval: 15s
    accuracy_decimals: 3
    lambda: |-
      if (id(measured_current_c01).state > 0.03) {
        static const float VOLTS[] = {120.0f, 240.0f, 230.0f};
        float volts = VOLTS[id(circuit_voltage_c01).active_index().value_or(0)];
        return id(measured_current_c01).state * volts / 1000;
      }
      return 0.0;

  - platform: total_daily_energy
    id: tde_c01
    name: $measured_total_power_daily
    device_id: dev_c01
    power_id: power_c01
    device_class: energy
    restore: true

